# Ruff is a lint gate only (`ruff check .`): no formatter is configured, and this is not a
# package, so there is deliberately no [project] table.
[tool.ruff]
target-version = "py310"
# Longest existing line (142 characters); E501 only trips on new outliers, no re-wrapping needed.
line-length = 142

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "B904",  # services re-raise a user-safe error inside `except` on purpose; `from` would change chaining
]
