# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: resilient-ai-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BALE_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Optional: comma-separated extra keys, merged with the three above (key rotation).
      - key: GROQ_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: TAVILY_API_KEYS
        sync: false
      - key: ALLOWED_USERS
        sync: false
      # Per-user rate limit: AI-consuming requests per user within the window. 0 turns it off.
      - key: RATE_LIMIT_MAX
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Smart web search: a small model call decides whether a message needs fresh web data.
      - key: SEARCH_PLANNER_ENABLED
        value: "true"
      - key: SEARCH_PLANNER_TIMEOUT_SECONDS
        value: "4"
      # Identical search queries are reused for this many seconds. 0 turns the cache off.
      - key: SEARCH_CACHE_TTL_SECONDS
        value: "600"
